[project]
name = "onboard"
version = "0.1.0"
description = "Customer data onboarding: profile, map, validate, resolve and serve messy exports"
readme = "README.md"
authors = [
    { name = "bytekumar", email = "chamansuper1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-calamine>=0.9.1",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.3.3",
]

[project.scripts]
onboard = "onboard.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
